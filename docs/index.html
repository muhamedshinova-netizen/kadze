<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёплый Кадр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Тёплый Кадр</h1>
        <p>Загрузи фото и выбери стиль анимации</p>
        
        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <span id="uploadText">📷 Нажми, чтобы выбрать фото</span>
            <img id="preview" style="display:none; max-width:100%">
        </div>

        <div class="categories" id="categories" style="display:none;">
            <label>Категория:</label>
            <select id="categorySelect">
                <option value="portrait">Портрет</option>
                <option value="nature">Природа</option>
                <option value="city">Город</option>
                <option value="interior">Интерьер</option>
                <option value="fantasy">Фэнтези</option>
            </select>
            <label>Стиль:</label>
            <select id="styleSelect"></select>
            <button id="generateBtn" class="button">Сгенерировать ✨</button>
        </div>
        <p id="status"></p>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
